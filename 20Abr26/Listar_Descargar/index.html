<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listar y Descargar Usuarios</title>
    <style>
        .usuario-card {
            border: 1px solid #ccc;
            padding: 10px;
            margin-bottom: 10px;
            border-left: 5px solid #007bff;
            background-color: #f9f9f9;
        }
        .editable {
            cursor: pointer;
            padding: 2px 5px;
        }
        .editable:hover {
            background-color: #ffffd0;
            border-radius: 3px;
        }
        .btn-eliminar {
            color: white;
            background-color: #ff4d4d;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <h2>Formulario para guardar usuarios</h2>
    <br>
    <form id="userForm">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="name" required><br><br>
        <label for="correo">Correo electrónico:</label>
        <input type="email" id="correo" name="email" required><br><br>
        <button type="submit">Guardar en LocalStorage</button>
    </form>
    <br>
    <hr>
    <button id="descargarBtn">Descargar JSON</button>
    <button id="limpiarBtn" style="background-color: #f4f4f4;">Borrar Todo</button>
    <br>
    <hr>
    <h3>Usuarios registrados (Haz clic en los datos para editar):</h3>
    <div id="contenedorUsuarios">
        </div>

    <script src="app.js"></script>
</body>
</html>
