services:
  # ==========================================
  # Contenedor 1: Base de datos MySQL
  # ==========================================
  db:
    image: mysql:8.0
    platform: linux/amd64
    container_name: fleetops_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: fleetops_db
    ports:
      - "3307:3306"
    volumes:
      # Ejecuta el script SQL automaticamente la primera vez que arranca
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      # Guarda los datos para que no se pierdan al apagar el contenedor
      - mysql_data:/var/lib/mysql
    healthcheck:
      # Esperamos a que MySQL este realmente listo antes de arrancar la API
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ==========================================
  # Contenedor 2: API Node/Express (+ frontend)
  # ==========================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fleetops_api
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_HOST: db          # Apunta al nombre del servicio de la base de datos
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: fleetops_db
      JWT_SECRET: fleetops_super_secret_key_2026
    depends_on:
      db:
        condition: service_healthy   # Espera a que la DB pase el healthcheck

volumes:
  mysql_data:
